name: astrbot_plugin_persona_growth
display_name: 人格成长
desc: 不靠指令、不显示分数。糯糯会用自己的口吻写日记，偶尔以游客身份刷B站上的傲娇视频、看小说台词片段，学一点顺口的说话方式；剩下的冲浪时间用来娱乐，学梗、刷游戏、看笑话和杂谈，也会刷没见过的视频和文章；还会悄悄学群里人的接话习惯。群聊里回得太密会装累，说一句「累了」后安静一段时间。私聊爸时可以连发 3-5 条短句，也会自然回指之前聊过的具体事。
short_desc: 会自己刷B站学说话、学梗/游戏/笑话/杂谈，群聊会装累，冲浪来源可查
