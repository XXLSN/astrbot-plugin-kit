name: astrbot_plugin_group_proactive
display_name: 群聊主动聊天
desc: 上线第一件事先补读离线期间的消息（最多 200 条，群聊看最近 6 小时、和管理员账户私聊看最近 24 小时，群里错过 ≥5 条或被 @ 才让模型判断），再进正常循环。群聊里只在感兴趣时接话，不冷场分享、不发链接；她说完话后别人接着聊（没 @ 她也算），每条 +3% 补话概率、封顶 50%，只在 5 分钟窗口内累加，断档 2 分钟或补话后 10 分钟冷却期内不涨。同一批几乎同时进来的几条群消息会按群串行判定，一个守望窗口只建一个任务，不会把同一个话题回两遍。群里有人用「bot名称」「bot名称」「bot名称」等名字或她的 QQ 号叫她、但没 @ 或引用时，会先读历史确认是不是真的在叫她，是就回一句，碰巧提到就沉默，每群 10 分钟内最多一次。群聊摘要每行都带着那条消息的 id（`[15:13#100000001]`），她要回的那条消息后面已经隔了 8 条以上，就会在回复里带上对它的引用，让人看得出在回哪一条；回最近一两条则不引用。是否够 8 条由插件按发送前的真实群历史判定（她自己发的也算），不靠模型自己数；id 对不上就只发正文。对当前话题聊腻了、觉得一直在绕圈时，可以在大家还在聊的前提下主动换一个自己感兴趣或新学到的话题；群里没人说话时不热场、不冷启动话题。私聊管理员分两段：热聊时每回一句主动补话概率加 5%（封顶 50%），冷场 20 分钟后按 20/40/80/160 分钟渐进退避、不限次数。冷场计时只认管理员账户真正发来的消息，她自己的主动消息写回会话不会重置计时和退避。主动消息会读人格日记找话题，并把实际发出的文本写回会话。启动时会等 QQ 反向 WebSocket 真正连上再安排主动任务，发送失败会撤销这次尝试；private_only_mode 打开后只和管理员账户私聊、不回群和其他人。普通好友私聊也会主动：只找聊过天且在好友列表里的人，冷场 60 分钟触发，按 20/40/80/160 分钟退避，每人每天最多 3 条、所有好友合计 20 条，用对方昵称称呼，只读公开的 web 日记。不在好友列表里的人发起私聊时，插件在本地直接把消息丢掉——不进模型、不发请求、也不会对他主动；好友名单读不到时会放行，免得把真好友弄哑。
short_desc: 上线补读 + 群聊兴趣接话/换话题/被叫到/回旧消息@人 + 私聊两段式主动（管理员 + 聊过天的好友）
version: 1.10.1
author: local
